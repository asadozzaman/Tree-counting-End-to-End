name: Worker unit tests
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  worker-unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test runner
        run: python -m pip install pytest==8.3.4
      - name: Check API and worker syntax
        run: python -m compileall -q api/app worker/app
      - name: Test worker metrics without model weights
        working-directory: worker
        run: python -m pytest -q tests/test_metrics.py
